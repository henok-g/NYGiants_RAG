# configs/pipeline.yaml

pipeline:
  run_ingestion:  false    # chunk + embed corpus
  run_retrieval:  false    # test retrieval on sample queries
  run_generation: false    # generate answers
  run_evaluation: true   # Phase III — off until golden QA set exists

ingestion:
  posts_file:    data/posts.jsonl
  comments_file: data/comments.jsonl
  filters:
    min_comment_score:  2
    min_comment_chars:  40
    min_post_score:     10
    max_depth:          6
    exclude_flairs:
      - "Meme/Shitpost"
    exclude_authors:
      - "u/AutoModerator"
  chunking:
    strategy:         adaptive     # adaptive | fixed | semantic
    tiny_threshold:   100          # chars — bundle these
    short_threshold:  400          # chars — bundle 2-3
    long_threshold:   800          # chars — split these
    split_size:       600          # tokens
    split_overlap:    100          # tokens
    max_bundle_size:  8            # max comments per bundle

embedding:
  provider:   ollama               # ollama | openai
  model:      nomic-embed-text     # swap here to experiment bge-large-en-v1.5, gte-large
  chroma_dir: ./chroma_db
  collection: nygiants_chunks
  dimensions: 768

retrieval:
  k:              20
  min_score:      0.7
  max_per_date:   3                # diversity filter
  max_per_author: 2                # diversity filter

generation:
  provider: anthropic              # anthropic | ollama
  model:    claude-sonnet-4-6      # swap here to experiment
  prompt_template: configs/prompts/fan_sentiment_v1.txt
  max_tokens: 1000

evaluation:
  build_from_scratch: true
  test_set_path: data/evaluation/knowledge_graphs/
  metrics:
    - faithfulness
    - answer_relevancy
    - context_recall
    - context_precision
  mlflow_experiment: nygiants_rag
  llm:
    LOCAL_API_BASE: "http://localhost:8080"
    MODEL_NAME: "gemma4"

  
  mode: "prototype" # options: [prototype, production]
  prototype_settings:
    island_count: 3
    nodes_per_island: 20
  production_settings:
    island_count: 50
    nodes_per_island: 10

